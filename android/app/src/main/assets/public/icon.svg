<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>
  <!-- Background squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="240" rx="108" fill="url(#glowGrad)" />
  
  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#ffffff" stroke-width="8" stroke-opacity="0.25" stroke-dasharray="16 12" />
  
  <!-- Indian Rupee Symbol (₹) & Calendar Growth Glyph -->
  <g fill="#ffffff" transform="translate(140, 100) scale(1.05)">
    <!-- Top Bar 1 -->
    <rect x="0" y="20" width="220" height="32" rx="16" />
    <!-- Top Bar 2 -->
    <rect x="0" y="80" width="220" height="32" rx="16" />
    <!-- Central Curve and Stem -->
    <path d="M 0,20 L 70,20 C 130,20 180,60 180,120 C 180,175 135,215 75,220 L 210,360 C 218,368 214,380 202,380 L 140,380 C 130,380 120,375 114,368 L 0,240 L 0,200 L 70,200 C 110,198 140,170 140,125 C 140,80 110,55 70,55 L 0,55 Z" />
  </g>

  <!-- Sparkle Star Accent -->
  <path d="M 390 100 Q 390 130 420 130 Q 390 130 390 160 Q 390 130 360 130 Q 390 130 390 100 Z" fill="#34d399" />
</svg>
