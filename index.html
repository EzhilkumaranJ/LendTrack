<!doctype html>
<html lang="en">
  <head>

    <title>Lending Tracker & Reminders</title>
    <meta name="description" content="An Android-styled lending and interest collection tracker with custom repeating due dates, payment history, notification reminders, and Google Calendar sync." />
    
    <!-- PWA Web App Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- OpenGraph / Social Meta Tags -->
    <meta property="og:title" content="Lending Tracker & Reminders" />

  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-emerald-500 selection:text-white">
